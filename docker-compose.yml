version: "3"

services:
  app:
    container_name: app
    build: .
    image: laravel-app-demo:latest
    restart: always
    ports:
      - ${APP_HOST:-8085}:80
      - ${MCP_PORT:-5173}:5173
    volumes:
      - app_data:/data
    depends_on:
      - laravel-app-database

  laravel-app-database:
    container_name: laravel-app-database
    image: mariadb:${MARIADB_VERSION:-10.8.3}
    restart: always
    ports:
      - 3308:3306
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-laravel}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_data:
