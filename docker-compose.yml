version: "3"

services:
  app:
    container_name: app
    build: .
    image: laravel-app-demo:latest
    restart: always
    ports:
      - ${APP_HOST:-80}:80
      - ${MCP_PORT:-5137}:5137
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - app_data:/data
    depends_on:
      - database

  database:
    container_name: database
    image: mariadb:${MARIADB_VERSION:-10.8.3}
    restart: always
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-laravel}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_data:
