apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: dopplersecret-laravel-app # DopplerSecret Name
  namespace: doppler-operator-system
spec:
  tokenSecret: # Kubernetes service token secret (namespace defaults to doppler-operator-system)
    name: doppler-token-secret-laravel-app
  managedSecret: # Kubernetes managed secret (will be created if does not exist)
    name: doppler-token-secret-app-laravel
    namespace: demos # Should match the namespace of deployments that will use the secret